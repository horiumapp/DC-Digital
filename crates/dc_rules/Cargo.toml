[package]
name = "dc_rules"
version = "0.1.0"
edition = "2021"
description = "Regras pedagógicas puras do DC Digital (LDB frequência) para WASM"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
